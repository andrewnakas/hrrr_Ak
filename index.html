<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alaska HRRR Radar Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 300px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .info-panel p {
            margin: 5px 0;
            font-size: 14px;
        }
        #status {
            font-size: 12px;
            color: #666;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 8px 15px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .legend {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 3px;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
        }
        .legend-scale {
            display: flex;
            height: 20px;
            margin: 5px 0;
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>Alaska Radar - HRRR + NEXRAD</h3>
        <p><strong>HRRR:</strong> <span id="hrrr-status">Loading...</span></p>
        <p><strong>NEXRAD:</strong> <span id="nexrad-status">Active</span></p>
        <p id="status">Initializing...</p>
        <div class="controls">
            <button id="refresh" onclick="refreshData()">Refresh HRRR</button>
            <button id="toggle-hrrr" onclick="toggleHRRR()">Hide HRRR</button>
            <button id="toggle-nexrad" onclick="toggleNEXRAD()">Hide NEXRAD</button>
        </div>
        <div class="legend">
            <div class="legend-title">Reflectivity (dBZ)</div>
            <div class="legend-scale" id="legend-scale"></div>
            <div class="legend-labels">
                <span>5</span>
                <span>20</span>
                <span>35</span>
                <span>50</span>
                <span>65</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Alaska
        const map = L.map('map').setView([64.0, -152.0], 5);

        // Add base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let nexradOverlay = null;
        let hrrrOverlay = null;
        let nexradVisible = true;
        let hrrrVisible = true;

        // Create legend gradient
        const legendScale = document.getElementById('legend-scale');
        const colors = [
            '#00000000', // transparent
            '#9EF5FF',   // light blue
            '#0000FF',   // blue
            '#00FF00',   // green
            '#00C000',   // dark green
            '#FFFF00',   // yellow
            '#FF8000',   // orange
            '#FF0000',   // red
            '#C00000',   // dark red
            '#FF00FF',   // magenta
            '#FFFFFF'    // white
        ];
        colors.forEach(color => {
            const div = document.createElement('div');
            div.style.flex = '1';
            div.style.background = color;
            legendScale.appendChild(div);
        });

        // Initialize NEXRAD layer
        function initNEXRAD() {
            const nexradUrl = 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png';

            nexradOverlay = L.tileLayer(nexradUrl, {
                opacity: 0.5,
                attribution: 'Iowa Environmental Mesonet - NEXRAD',
                maxZoom: 10,
                tileSize: 256
            });

            if (nexradVisible) {
                nexradOverlay.addTo(map);
            }

            document.getElementById('nexrad-status').textContent = 'Active';
        }

        // Fetch and render HRRR Alaska GRIB2 data
        async function fetchHRRRData() {
            const statusEl = document.getElementById('status');
            const hrrrStatusEl = document.getElementById('hrrr-status');
            const refreshBtn = document.getElementById('refresh');

            try {
                statusEl.textContent = 'Loading HRRR Alaska data...';
                hrrrStatusEl.textContent = 'Loading...';
                refreshBtn.disabled = true;

                // Get current UTC time and find latest HRRR run
                const now = new Date();
                const hours = now.getUTCHours();
                const year = now.getUTCFullYear();
                const month = String(now.getUTCMonth() + 1).padStart(2, '0');
                const day = String(now.getUTCDate()).padStart(2, '0');

                // HRRR runs hourly but has a delay
                // Try to find the most recent available run
                let runHour = null;
                let runDate = `${year}${month}${day}`;
                let tileUrl = null;

                // Try Iowa State Mesonet HRRR Alaska tiles if available
                // Otherwise use CONUS HRRR which may show some Alaska coverage
                for (let hourOffset = 1; hourOffset <= 6; hourOffset++) {
                    const testHour = Math.max(0, hours - hourOffset);
                    const testHourStr = String(testHour).padStart(2, '0');

                    // Try HRRR composite reflectivity tiles from Iowa Mesonet
                    const testUrl = `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/hrrr-composite-${runDate}${testHourStr}00/{z}/{x}/{y}.png`;

                    // Test if tiles are available
                    try {
                        const testTile = testUrl.replace('{z}', '3').replace('{x}', '1').replace('{y}', '1');
                        const response = await fetch(testTile, { method: 'HEAD' });
                        if (response.ok) {
                            tileUrl = testUrl;
                            runHour = testHourStr;
                            statusEl.textContent = `Found HRRR data for ${testHourStr}:00Z`;
                            break;
                        }
                    } catch (e) {
                        console.log(`Hour ${testHourStr} not available`);
                    }
                }

                if (!tileUrl) {
                    // Fallback to most recent hour without checking (it will show 404 tiles if not available)
                    const fallbackHour = Math.max(0, hours - 2);
                    runHour = String(fallbackHour).padStart(2, '0');
                    tileUrl = `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/hrrr-composite-${runDate}${runHour}00/{z}/{x}/{y}.png`;
                }

                if (hrrrOverlay) {
                    map.removeLayer(hrrrOverlay);
                }

                hrrrOverlay = L.tileLayer(tileUrl, {
                    opacity: 0.7,
                    attribution: 'Iowa Mesonet - HRRR REFC',
                    maxZoom: 10,
                    tileSize: 256,
                    bounds: [[25, -130], [50, -60]] // CONUS bounds, includes some Alaska coverage
                });

                if (hrrrVisible) {
                    hrrrOverlay.addTo(map);
                }

                hrrrStatusEl.innerHTML = `${runDate} ${runHour}:00Z`;
                statusEl.innerHTML = `<span style="color: green;">HRRR tiles loaded</span><br><small>Composite reflectivity from Iowa Mesonet</small>`;

            } catch (error) {
                console.error('Error loading HRRR data:', error);
                hrrrStatusEl.innerHTML = `<span style="color: orange;">Not available</span>`;
                statusEl.innerHTML = `<span style="color: orange;">HRRR unavailable - using NEXRAD only</span><br><small>${error.message}</small>`;
            } finally {
                refreshBtn.disabled = false;
            }
        }

        function refreshData() {
            fetchHRRRData();
        }

        function toggleHRRR() {
            const toggleBtn = document.getElementById('toggle-hrrr');
            if (hrrrVisible && hrrrOverlay) {
                map.removeLayer(hrrrOverlay);
                hrrrVisible = false;
                toggleBtn.textContent = 'Show HRRR';
            } else if (hrrrOverlay) {
                hrrrOverlay.addTo(map);
                hrrrVisible = true;
                toggleBtn.textContent = 'Hide HRRR';
            }
        }

        function toggleNEXRAD() {
            const toggleBtn = document.getElementById('toggle-nexrad');
            if (nexradVisible && nexradOverlay) {
                map.removeLayer(nexradOverlay);
                nexradVisible = false;
                toggleBtn.textContent = 'Show NEXRAD';
            } else if (nexradOverlay) {
                nexradOverlay.addTo(map);
                nexradVisible = true;
                toggleBtn.textContent = 'Hide NEXRAD';
            }
        }

        // Initialize on page load
        initNEXRAD();
        fetchHRRRData();

        // Auto-refresh every 15 minutes
        setInterval(fetchHRRRData, 15 * 60 * 1000);
    </script>
</body>
</html>
