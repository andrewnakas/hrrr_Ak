<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alaska HRRR Radar Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 300px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .info-panel p {
            margin: 5px 0;
            font-size: 14px;
        }
        #status {
            font-size: 12px;
            color: #666;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 8px 15px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .legend {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 3px;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
        }
        .legend-scale {
            display: flex;
            height: 20px;
            margin: 5px 0;
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
        }
        .hrrr-debug-border {
            border: 3px solid red !important;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>Alaska Radar Viewer</h3>
        <p><strong>NEXRAD (Real-time):</strong> <span id="nexrad-status">Loading...</span></p>
        <p><strong>HRRR Alaska (Forecast):</strong> <span id="hrrr-status">Checking...</span></p>
        <p id="status" style="font-size: 11px; color: #888; margin-top: 8px;">HRRR Alaska data from AWS S3 via TiTiler. NEXRAD provides backup real-time radar.</p>
        <div class="controls">
            <button id="refresh" onclick="refreshData()">Refresh HRRR</button>
            <button id="toggle-hrrr" onclick="toggleHRRR()">Hide HRRR</button>
            <button id="toggle-nexrad" onclick="toggleNEXRAD()">Hide NEXRAD</button>
        </div>
        <div class="legend">
            <div class="legend-title">Reflectivity (dBZ)</div>
            <div class="legend-scale" id="legend-scale"></div>
            <div class="legend-labels">
                <span>5</span>
                <span>20</span>
                <span>35</span>
                <span>50</span>
                <span>65</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Alaska
        const map = L.map('map').setView([64.0, -152.0], 5);

        // Add base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let nexradOverlay = null;
        let hrrrOverlay = null;
        let hrrrOverlayDateline = null;  // For Alaska west of 180°
        let hrrrGridBoundary = null;  // HRRR Alaska grid boundary polygon
        let nexradVisible = true;
        let hrrrVisible = true;

        // Create legend gradient
        const legendScale = document.getElementById('legend-scale');
        const colors = [
            '#00000000', // transparent
            '#9EF5FF',   // light blue
            '#0000FF',   // blue
            '#00FF00',   // green
            '#00C000',   // dark green
            '#FFFF00',   // yellow
            '#FF8000',   // orange
            '#FF0000',   // red
            '#C00000',   // dark red
            '#FF00FF',   // magenta
            '#FFFFFF'    // white
        ];
        colors.forEach(color => {
            const div = document.createElement('div');
            div.style.flex = '1';
            div.style.background = color;
            legendScale.appendChild(div);
        });

        // Initialize HRRR Alaska using TiTiler + AWS S3 GRIB2 files
        async function initHRRRAlaska() {
            const statusEl = document.getElementById('status');
            const hrrrStatusEl = document.getElementById('hrrr-status');

            try {
                // Get current UTC time
                const now = new Date();
                const year = now.getUTCFullYear();
                const month = String(now.getUTCMonth() + 1).padStart(2, '0');
                const day = String(now.getUTCDate()).padStart(2, '0');

                // HRRR Alaska runs every 3 hours
                const hour = now.getUTCHours();
                const runHours = [0, 3, 6, 9, 12, 15, 18, 21];
                let nearestRun = runHours[0];

                for (let i = runHours.length - 1; i >= 0; i--) {
                    if (hour >= runHours[i]) {
                        nearestRun = runHours[i];
                        break;
                    }
                }

                const runHourStr = String(nearestRun).padStart(2, '0');
                const dateStr = `${year}${month}${day}`;
                const hourStr = `t${runHourStr}z`;

                // Build S3 GRIB2 URL for Alaska HRRR composite reflectivity
                const gribUrl = `https://noaa-hrrr-bdp-pds.s3.amazonaws.com/hrrr.${dateStr}/alaska/hrrr.${hourStr}.wrfsfcf00.ak.grib2`;
                const vrtUrl = `vrt://${gribUrl}?bands=1`;
                const encodedVrtUrl = encodeURIComponent(vrtUrl);

                // Composite reflectivity colormap (dBZ)
                const colormap = [
                    [[5,10],[0,236,236,255]],
                    [[10,15],[1,160,246,255]],
                    [[15,20],[0,0,246,255]],
                    [[20,25],[0,255,0,255]],
                    [[25,30],[0,200,0,255]],
                    [[30,35],[0,144,0,255]],
                    [[35,40],[255,255,0,255]],
                    [[40,45],[231,192,0,255]],
                    [[45,50],[255,144,0,255]],
                    [[50,55],[255,0,0,255]],
                    [[55,60],[214,0,0,255]],
                    [[60,65],[192,0,0,255]],
                    [[65,70],[255,0,255,255]],
                    [[70,75],[153,85,201,255]]
                ];
                const encodedColormap = encodeURIComponent(JSON.stringify(colormap));

                // Alaska bounds (min_lon, min_lat, max_lon, max_lat)
                // Fetch two separate images and combine into single canvas overlay

                // Main Alaska: -180°W to -130°W (east side, includes most of Alaska)
                const bboxMain = '-180.0,51.0,-130.0,71.5';
                const hrrrUrlMain = `https://raster.eoapi.dev/external/bbox/${bboxMain}.png?url=${encodedVrtUrl}&colormap=${encodedColormap}&dst_crs=epsg:3857`;

                // Dateline crossing: 170°E to 180°E (westernmost Aleutian Islands - Attu, Shemya, etc.)
                const bboxDateline = '170.0,51.0,180.0,71.5';
                const hrrrUrlDateline = `https://raster.eoapi.dev/external/bbox/${bboxDateline}.png?url=${encodedVrtUrl}&colormap=${encodedColormap}&dst_crs=epsg:3857`;

                // Combined bounds covering both images: -190°W to -130°W
                const boundsCombined = [[51.0, -190.0], [71.5, -130.0]];

                // Remove old overlays
                if (hrrrOverlay) {
                    map.removeLayer(hrrrOverlay);
                }
                if (hrrrOverlayDateline) {
                    map.removeLayer(hrrrOverlayDateline);
                }

                // Fetch both images and combine them
                const imgMain = new Image();
                const imgDateline = new Image();
                imgMain.crossOrigin = 'anonymous';
                imgDateline.crossOrigin = 'anonymous';

                let mainImageLoaded = false;
                let datelineImageLoaded = false;

                function createCombinedOverlay() {
                    if (!mainImageLoaded || !datelineImageLoaded) return;

                    // Calculate canvas dimensions
                    // Main image covers 50° longitude (-180 to -130)
                    // Dateline image covers 10° longitude (-190 to -180)
                    // Total span: 60° longitude (-190 to -130)
                    const totalLonSpan = 60; // degrees
                    const mainLonSpan = 50; // degrees
                    const datelineLonSpan = 10; // degrees

                    // Use main image height as reference
                    const canvasHeight = imgMain.height;
                    const canvasWidth = Math.round((totalLonSpan / mainLonSpan) * imgMain.width);

                    // Create canvas
                    const canvas = document.createElement('canvas');
                    canvas.width = canvasWidth;
                    canvas.height = canvasHeight;
                    const ctx = canvas.getContext('2d');

                    // Calculate positions
                    const datelineWidth = Math.round((datelineLonSpan / totalLonSpan) * canvasWidth);
                    const mainWidth = canvasWidth - datelineWidth;

                    // Draw dateline image on the left
                    ctx.drawImage(imgDateline, 0, 0, datelineWidth, canvasHeight);

                    // Draw main image on the right
                    ctx.drawImage(imgMain, datelineWidth, 0, mainWidth, canvasHeight);

                    // Convert canvas to data URL
                    const combinedImageUrl = canvas.toDataURL('image/png');

                    // Create single combined overlay with bounds from reference project
                    // Using continuous bounds that match the grid extent
                    const referenceBounds = [[51.23417834802149, -195.93090688492023], [69.55206432516226, -126.2019605906281]];

                    hrrrOverlay = L.imageOverlay(combinedImageUrl, referenceBounds, {
                        opacity: 0.7,
                        attribution: 'NOAA HRRR Alaska via TiTiler',
                        className: 'hrrr-debug-border'
                    });

                    if (hrrrVisible) {
                        hrrrOverlay.addTo(map);
                    }

                    console.log('HRRR Alaska: Combined image created!');
                    console.log('Reference bounds:', referenceBounds);
                    hrrrStatusEl.innerHTML = `<span style="color: green;" title="${year}-${month}-${day} ${runHourStr}:00Z">Active</span>`;
                    statusEl.innerHTML = `<span style="color: green;">HRRR Alaska loaded!</span><br><small>F000 composite reflectivity - ${year}-${month}-${day} ${runHourStr}:00Z</small>`;
                }

                imgMain.onload = function() {
                    console.log('HRRR Alaska Main: Image loaded successfully!');
                    mainImageLoaded = true;
                    createCombinedOverlay();
                };

                imgDateline.onload = function() {
                    console.log('HRRR Alaska Dateline: Image loaded successfully!');
                    datelineImageLoaded = true;
                    createCombinedOverlay();
                };

                imgMain.onerror = function() {
                    console.error('HRRR Alaska Main: Image failed to load');
                    hrrrStatusEl.innerHTML = `<span style="color: red;" title="Main image failed to load">Failed</span>`;
                    statusEl.innerHTML = `<span style="color: red;">HRRR Alaska unavailable</span><br><small>Data may not be available yet. Using NEXRAD.</small>`;
                };

                imgDateline.onerror = function() {
                    console.error('HRRR Alaska Dateline: Image failed to load');
                    hrrrStatusEl.innerHTML = `<span style="color: red;" title="Dateline image failed to load">Failed</span>`;
                    statusEl.innerHTML = `<span style="color: red;">HRRR Alaska unavailable</span><br><small>Data may not be available yet. Using NEXRAD.</small>`;
                };

                // Start loading images
                imgMain.src = hrrrUrlMain;
                imgDateline.src = hrrrUrlDateline;

                hrrrStatusEl.innerHTML = `<span style="color: orange;" title="Loading ${year}-${month}-${day} ${runHourStr}:00Z">Loading...</span>`;
                statusEl.innerHTML = `<span style="color: orange;">Loading HRRR Alaska...</span><br><small>Combining images with grid-aligned bounds</small>`;

                console.log(`HRRR Alaska: Loading ${year}-${month}-${day} ${runHourStr}:00Z`);
                console.log('GRIB2 URL:', gribUrl);
                console.log('Main tile bbox:', bboxMain);
                console.log('Dateline tile bbox:', bboxDateline);
                console.log('Combined bounds:', boundsCombined);
                console.log('TiTiler Main URL:', hrrrUrlMain);
                console.log('TiTiler Dateline URL:', hrrrUrlDateline);

            } catch (error) {
                console.error('Error loading HRRR Alaska:', error);
                hrrrStatusEl.innerHTML = `<span style="color: gray;" title="Error occurred">Unavailable</span>`;
            }
        }

        // Initialize NEXRAD layer from Iowa Mesonet
        function initNEXRAD() {
            const nexradUrl = 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png';

            nexradOverlay = L.tileLayer(nexradUrl, {
                opacity: 0.4,
                attribution: 'Iowa Environmental Mesonet - NEXRAD',
                maxZoom: 10,
                tileSize: 256
            });

            if (nexradVisible) {
                nexradOverlay.addTo(map);
            }

            document.getElementById('nexrad-status').innerHTML = '<span style="color: green;">Active</span>';
        }

        // Load and display HRRR Alaska grid boundary polygon
        async function loadGridBoundary() {
            try {
                const response = await fetch('hrrr-grid-boundary.json');
                const data = await response.json();

                // Convert boundary polygon to Leaflet format
                const boundaryCoords = data.boundary_polygon.map(p => [p.lat, p.lon]);

                // Create polygon with green stroke (matching Alaska_HRRR_Leaflet_Alignment)
                hrrrGridBoundary = L.polygon(boundaryCoords, {
                    color: '#00ff00',  // Bright green for grid boundary
                    weight: 4,         // Thicker line
                    fillOpacity: 0,    // Transparent fill
                    interactive: false,
                    opacity: 1.0       // Full opacity
                });

                if (hrrrVisible) {
                    hrrrGridBoundary.addTo(map);
                }

                console.log('✓ Grid boundary polygon loaded (green, solid) - ' + boundaryCoords.length + ' points');
            } catch (error) {
                console.error('Error loading grid boundary:', error);
            }
        }

        function refreshData() {
            initHRRRAlaska();
        }

        function toggleHRRR() {
            const toggleBtn = document.getElementById('toggle-hrrr');
            if (hrrrVisible) {
                if (hrrrOverlay) map.removeLayer(hrrrOverlay);
                if (hrrrGridBoundary) map.removeLayer(hrrrGridBoundary);
                hrrrVisible = false;
                toggleBtn.textContent = 'Show HRRR';
            } else {
                if (hrrrOverlay) hrrrOverlay.addTo(map);
                if (hrrrGridBoundary) hrrrGridBoundary.addTo(map);
                hrrrVisible = true;
                toggleBtn.textContent = 'Hide HRRR';
            }
        }

        function toggleNEXRAD() {
            const toggleBtn = document.getElementById('toggle-nexrad');
            if (nexradVisible && nexradOverlay) {
                map.removeLayer(nexradOverlay);
                nexradVisible = false;
                toggleBtn.textContent = 'Show NEXRAD';
            } else if (nexradOverlay) {
                nexradOverlay.addTo(map);
                nexradVisible = true;
                toggleBtn.textContent = 'Hide NEXRAD';
            }
        }

        // Initialize on page load
        initNEXRAD();
        initHRRRAlaska();
        loadGridBoundary();

        // Auto-refresh HRRR every 3 hours (when new runs are available)
        setInterval(refreshData, 3 * 60 * 60 * 1000);
    </script>
</body>
</html>
