<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alaska HRRR Radar Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 300px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .info-panel p {
            margin: 5px 0;
            font-size: 14px;
        }
        #status {
            font-size: 12px;
            color: #666;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 8px 15px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .legend {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 3px;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
        }
        .legend-scale {
            display: flex;
            height: 20px;
            margin: 5px 0;
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>Alaska HRRR Radar Viewer</h3>
        <p><strong>NOAA MRMS Radar:</strong> <span id="nexrad-status">Loading...</span></p>
        <p><strong>Iowa Mesonet:</strong> <span id="hrrr-status">Loading...</span></p>
        <p id="status">Initializing...</p>
        <div class="controls">
            <button id="refresh" onclick="refreshData()">Refresh All</button>
            <button id="toggle-noaa" onclick="toggleNOAA()">Hide NOAA</button>
            <button id="toggle-nexrad" onclick="toggleNEXRAD()">Hide Iowa</button>
        </div>
        <div class="legend">
            <div class="legend-title">Reflectivity (dBZ)</div>
            <div class="legend-scale" id="legend-scale"></div>
            <div class="legend-labels">
                <span>5</span>
                <span>20</span>
                <span>35</span>
                <span>50</span>
                <span>65</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Alaska
        const map = L.map('map').setView([64.0, -152.0], 5);

        // Add base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let nexradOverlay = null;
        let noaaRadarOverlay = null;
        let nexradVisible = true;
        let noaaVisible = true;

        // Create legend gradient
        const legendScale = document.getElementById('legend-scale');
        const colors = [
            '#00000000', // transparent
            '#9EF5FF',   // light blue
            '#0000FF',   // blue
            '#00FF00',   // green
            '#00C000',   // dark green
            '#FFFF00',   // yellow
            '#FF8000',   // orange
            '#FF0000',   // red
            '#C00000',   // dark red
            '#FF00FF',   // magenta
            '#FFFFFF'    // white
        ];
        colors.forEach(color => {
            const div = document.createElement('div');
            div.style.flex = '1';
            div.style.background = color;
            legendScale.appendChild(div);
        });

        // Initialize NOAA MRMS Radar with WMS (includes Alaska!)
        function initNOAARadar() {
            // NOAA WMS ImageServer - explicitly includes Alaska coverage
            // Updates every 10 minutes, 4-hour moving window
            const wmsUrl = 'https://mapservices.weather.noaa.gov/eventdriven/services/radar/radar_base_reflectivity_time/ImageServer/WMSServer';

            noaaRadarOverlay = L.tileLayer.wms(wmsUrl, {
                layers: '0',
                format: 'image/png',
                transparent: true,
                opacity: 0.7,
                attribution: 'NOAA MRMS Radar',
                version: '1.3.0',
                crs: L.CRS.EPSG3857
            });

            if (noaaVisible) {
                noaaRadarOverlay.addTo(map);
            }

            document.getElementById('nexrad-status').innerHTML = '<span style="color: green;">Active (Alaska + CONUS)</span>';
        }

        // Initialize NEXRAD layer from Iowa Mesonet
        function initNEXRAD() {
            const nexradUrl = 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png';

            nexradOverlay = L.tileLayer(nexradUrl, {
                opacity: 0.5,
                attribution: 'Iowa Environmental Mesonet - NEXRAD',
                maxZoom: 10,
                tileSize: 256
            });

            if (nexradVisible) {
                nexradOverlay.addTo(map);
            }

            document.getElementById('hrrr-status').innerHTML = '<span style="color: green;">Active</span>';
        }

        // Refresh both layers
        async function fetchHRRRData() {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = '<span style="color: green;">All layers active</span><br><small>NOAA MRMS provides Alaska coverage • Updates every 10 min</small>';
        }

        function refreshData() {
            // Refresh NOAA WMS layer
            if (noaaRadarOverlay) {
                map.removeLayer(noaaRadarOverlay);
                initNOAARadar();
            }

            // Refresh Iowa Mesonet layer
            if (nexradOverlay) {
                map.removeLayer(nexradOverlay);
                initNEXRAD();
            }

            document.getElementById('status').innerHTML = '<span style="color: green;">Layers refreshed</span>';
        }

        function toggleNOAA() {
            const toggleBtn = document.getElementById('toggle-noaa');
            if (noaaVisible && noaaRadarOverlay) {
                map.removeLayer(noaaRadarOverlay);
                noaaVisible = false;
                toggleBtn.textContent = 'Show NOAA';
            } else if (noaaRadarOverlay) {
                noaaRadarOverlay.addTo(map);
                noaaVisible = true;
                toggleBtn.textContent = 'Hide NOAA';
            }
        }

        function toggleNEXRAD() {
            const toggleBtn = document.getElementById('toggle-nexrad');
            if (nexradVisible && nexradOverlay) {
                map.removeLayer(nexradOverlay);
                nexradVisible = false;
                toggleBtn.textContent = 'Show Iowa';
            } else if (nexradOverlay) {
                nexradOverlay.addTo(map);
                nexradVisible = true;
                toggleBtn.textContent = 'Hide Iowa';
            }
        }

        // Initialize on page load
        initNOAARadar();
        initNEXRAD();
        fetchHRRRData();

        // Auto-refresh every 15 minutes
        setInterval(refreshData, 15 * 60 * 1000);
    </script>
</body>
</html>
