<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alaska HRRR Radar Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 300px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .info-panel p {
            margin: 5px 0;
            font-size: 14px;
        }
        #status {
            font-size: 12px;
            color: #666;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 8px 15px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .legend {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 3px;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
        }
        .legend-scale {
            display: flex;
            height: 20px;
            margin: 5px 0;
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>Alaska Radar Viewer</h3>
        <p><strong>NEXRAD (Real-time):</strong> <span id="nexrad-status">Loading...</span></p>
        <p><strong>HRRR Alaska (Forecast):</strong> <span id="hrrr-status">Checking...</span></p>
        <p id="status" style="font-size: 11px; color: #888; margin-top: 8px;">Note: HRRR Alaska imagery from NOAA may be unavailable due to service limitations. NEXRAD provides reliable real-time radar coverage.</p>
        <div class="controls">
            <button id="refresh" onclick="refreshData()">Refresh HRRR</button>
            <button id="toggle-hrrr" onclick="toggleHRRR()">Hide HRRR</button>
            <button id="toggle-nexrad" onclick="toggleNEXRAD()">Hide NEXRAD</button>
        </div>
        <div class="legend">
            <div class="legend-title">Reflectivity (dBZ)</div>
            <div class="legend-scale" id="legend-scale"></div>
            <div class="legend-labels">
                <span>5</span>
                <span>20</span>
                <span>35</span>
                <span>50</span>
                <span>65</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Alaska
        const map = L.map('map').setView([64.0, -152.0], 5);

        // Add base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let nexradOverlay = null;
        let hrrrOverlay = null;
        let nexradVisible = true;
        let hrrrVisible = true;

        // Create legend gradient
        const legendScale = document.getElementById('legend-scale');
        const colors = [
            '#00000000', // transparent
            '#9EF5FF',   // light blue
            '#0000FF',   // blue
            '#00FF00',   // green
            '#00C000',   // dark green
            '#FFFF00',   // yellow
            '#FF8000',   // orange
            '#FF0000',   // red
            '#C00000',   // dark red
            '#FF00FF',   // magenta
            '#FFFFFF'    // white
        ];
        colors.forEach(color => {
            const div = document.createElement('div');
            div.style.flex = '1';
            div.style.background = color;
            legendScale.appendChild(div);
        });

        // Initialize HRRR Alaska from rapidrefresh.noaa.gov
        async function initHRRRAlaska() {
            const statusEl = document.getElementById('status');
            const hrrrStatusEl = document.getElementById('hrrr-status');

            try {
                // Get current UTC time
                const now = new Date();
                const year = now.getUTCFullYear();
                const month = String(now.getUTCMonth() + 1).padStart(2, '0');
                const day = String(now.getUTCDate()).padStart(2, '0');

                // HRRR Alaska runs every 3 hours
                const hour = now.getUTCHours();
                const runHours = [0, 3, 6, 9, 12, 15, 18, 21];
                let nearestRun = runHours[0];

                for (let i = runHours.length - 1; i >= 0; i--) {
                    if (hour >= runHours[i]) {
                        nearestRun = runHours[i];
                        break;
                    }
                }

                const runHourStr = String(nearestRun).padStart(2, '0');
                const runtime = `${year}${month}${day}${runHourStr}`;

                // Build HRRR Alaska image URL (composite reflectivity, 0-hour forecast)
                const hrrrUrl = `https://rapidrefresh.noaa.gov/alaska/displayMapUpdated.cgi?keys=hrrrak_ncep_jet:&runtime=${runtime}&plot_type=cref_full_sfc&fcst=000&time_inc=60&num_times=49&model=hrrr&domain=full:hrrrak`;

                // Alaska bounds for HRRR image overlay
                const bounds = [[51.0, -179.0], [71.5, -130.0]];

                if (hrrrOverlay) {
                    map.removeLayer(hrrrOverlay);
                }

                hrrrOverlay = L.imageOverlay(hrrrUrl, bounds, {
                    opacity: 0.7,
                    attribution: 'NOAA HRRR Alaska'
                });

                if (hrrrVisible) {
                    hrrrOverlay.addTo(map);
                }

                hrrrStatusEl.innerHTML = `<span style="color: orange;" title="Attempting ${year}-${month}-${day} ${runHourStr}:00Z">Attempted</span>`;

                // Note: rapidrefresh.noaa.gov may not serve images reliably
                // The overlay attempts to load but may fail silently
                console.log(`HRRR Alaska: Attempting ${year}-${month}-${day} ${runHourStr}:00Z`);

            } catch (error) {
                console.error('Error loading HRRR Alaska:', error);
                hrrrStatusEl.innerHTML = `<span style="color: gray;" title="Service may be unavailable">Unavailable</span>`;
            }
        }

        // Initialize NEXRAD layer from Iowa Mesonet
        function initNEXRAD() {
            const nexradUrl = 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png';

            nexradOverlay = L.tileLayer(nexradUrl, {
                opacity: 0.4,
                attribution: 'Iowa Environmental Mesonet - NEXRAD',
                maxZoom: 10,
                tileSize: 256
            });

            if (nexradVisible) {
                nexradOverlay.addTo(map);
            }

            document.getElementById('nexrad-status').innerHTML = '<span style="color: green;">Active</span>';
        }

        function refreshData() {
            initHRRRAlaska();
        }

        function toggleHRRR() {
            const toggleBtn = document.getElementById('toggle-hrrr');
            if (hrrrVisible && hrrrOverlay) {
                map.removeLayer(hrrrOverlay);
                hrrrVisible = false;
                toggleBtn.textContent = 'Show HRRR';
            } else if (hrrrOverlay) {
                hrrrOverlay.addTo(map);
                hrrrVisible = true;
                toggleBtn.textContent = 'Hide HRRR';
            }
        }

        function toggleNEXRAD() {
            const toggleBtn = document.getElementById('toggle-nexrad');
            if (nexradVisible && nexradOverlay) {
                map.removeLayer(nexradOverlay);
                nexradVisible = false;
                toggleBtn.textContent = 'Show NEXRAD';
            } else if (nexradOverlay) {
                nexradOverlay.addTo(map);
                nexradVisible = true;
                toggleBtn.textContent = 'Hide NEXRAD';
            }
        }

        // Initialize on page load
        initNEXRAD();
        initHRRRAlaska();

        // Auto-refresh HRRR every 3 hours (when new runs are available)
        setInterval(refreshData, 3 * 60 * 60 * 1000);
    </script>
</body>
</html>
