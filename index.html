<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alaska Radar Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 300px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .info-panel p {
            margin: 5px 0;
            font-size: 14px;
        }
        #status {
            font-size: 12px;
            color: #666;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 8px 15px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .legend {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 3px;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
        }
        .legend-scale {
            display: flex;
            height: 20px;
            margin: 5px 0;
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>Alaska Radar Viewer</h3>
        <p><strong>Data:</strong> NEXRAD Composite Reflectivity</p>
        <p><strong>Coverage:</strong> Real-time Alaska & CONUS</p>
        <p><strong>Product:</strong> Base Reflectivity (N0Q)</p>
        <p id="status">Loading...</p>
        <div class="controls">
            <button id="refresh" onclick="refreshData()">Refresh</button>
            <button id="toggle" onclick="toggleOverlay()">Hide Overlay</button>
        </div>
        <div class="legend">
            <div class="legend-title">Reflectivity (dBZ)</div>
            <div class="legend-scale" id="legend-scale"></div>
            <div class="legend-labels">
                <span>5</span>
                <span>20</span>
                <span>35</span>
                <span>50</span>
                <span>65</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Alaska
        const map = L.map('map').setView([64.0, -152.0], 5);

        // Add base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let radarOverlay = null;
        let overlayVisible = true;

        // Create legend gradient
        const legendScale = document.getElementById('legend-scale');
        const colors = [
            '#00000000', // transparent
            '#9EF5FF',   // light blue
            '#0000FF',   // blue
            '#00FF00',   // green
            '#00C000',   // dark green
            '#FFFF00',   // yellow
            '#FF8000',   // orange
            '#FF0000',   // red
            '#C00000',   // dark red
            '#FF00FF',   // magenta
            '#FFFFFF'    // white
        ];
        colors.forEach(color => {
            const div = document.createElement('div');
            div.style.flex = '1';
            div.style.background = color;
            legendScale.appendChild(div);
        });

        async function fetchHRRRData() {
            const statusEl = document.getElementById('status');
            const refreshBtn = document.getElementById('refresh');

            try {
                statusEl.textContent = 'Fetching latest radar data...';
                refreshBtn.disabled = true;

                if (radarOverlay) {
                    map.removeLayer(radarOverlay);
                }

                // Use Iowa Environmental Mesonet NEXRAD composite
                // This provides real-time radar coverage for all of North America including Alaska
                const nexradUrl = 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png';

                radarOverlay = L.tileLayer(nexradUrl, {
                    opacity: 0.7,
                    attribution: 'Iowa Environmental Mesonet - NEXRAD',
                    maxZoom: 10,
                    tileSize: 256
                });

                if (overlayVisible) {
                    radarOverlay.addTo(map);
                }

                const timestamp = new Date().toUTCString();
                statusEl.innerHTML = `Real-time NEXRAD radar<br><small>Updated: ${timestamp}</small>`;

            } catch (error) {
                console.error('Error fetching radar data:', error);
                statusEl.innerHTML = `<span style="color: red;">Error loading radar data</span>`;

                // Fallback to RainViewer
                if (radarOverlay) {
                    map.removeLayer(radarOverlay);
                }

                const rainviewerUrl = 'https://tilecache.rainviewer.com/v2/radar/nowcast/256/{z}/{x}/{y}/2/1_1.png';

                radarOverlay = L.tileLayer(rainviewerUrl, {
                    opacity: 0.6,
                    attribution: 'RainViewer',
                    maxZoom: 10,
                    tileSize: 256
                });

                if (overlayVisible) {
                    radarOverlay.addTo(map);
                }
            } finally {
                refreshBtn.disabled = false;
            }
        }

        function refreshData() {
            fetchHRRRData();
        }

        function toggleOverlay() {
            const toggleBtn = document.getElementById('toggle');
            if (overlayVisible && radarOverlay) {
                map.removeLayer(radarOverlay);
                overlayVisible = false;
                toggleBtn.textContent = 'Show Overlay';
            } else if (radarOverlay) {
                radarOverlay.addTo(map);
                overlayVisible = true;
                toggleBtn.textContent = 'Hide Overlay';
            }
        }

        // Load data on page load
        fetchHRRRData();

        // Auto-refresh every 5 minutes
        setInterval(fetchHRRRData, 5 * 60 * 1000);
    </script>
</body>
</html>
