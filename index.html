<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alaska HRRR Radar Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 300px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .info-panel p {
            margin: 5px 0;
            font-size: 14px;
        }
        #status {
            font-size: 12px;
            color: #666;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 8px 15px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .legend {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 3px;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
        }
        .legend-scale {
            display: flex;
            height: 20px;
            margin: 5px 0;
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>Alaska HRRR Radar</h3>
        <p><strong>HRRR:</strong> <span id="hrrr-status">Loading...</span></p>
        <p><strong>NEXRAD:</strong> <span id="nexrad-status">Active</span></p>
        <p><strong>Forecast:</strong> F000 (0-hour)</p>
        <p id="status">Initializing...</p>
        <div class="controls">
            <button id="refresh" onclick="refreshData()">Refresh HRRR</button>
            <button id="toggle-hrrr" onclick="toggleHRRR()">Hide HRRR</button>
            <button id="toggle-nexrad" onclick="toggleNEXRAD()">Hide NEXRAD</button>
        </div>
        <div class="legend">
            <div class="legend-title">Reflectivity (dBZ)</div>
            <div class="legend-scale" id="legend-scale"></div>
            <div class="legend-labels">
                <span>5</span>
                <span>20</span>
                <span>35</span>
                <span>50</span>
                <span>65</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="grib2-parser.js"></script>
    <script>
        // Initialize map centered on Alaska
        const map = L.map('map').setView([64.0, -152.0], 5);

        // Add base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let nexradOverlay = null;
        let hrrrOverlay = null;
        let nexradVisible = true;
        let hrrrVisible = true;

        // Create legend gradient
        const legendScale = document.getElementById('legend-scale');
        const colors = [
            '#00000000', // transparent
            '#9EF5FF',   // light blue
            '#0000FF',   // blue
            '#00FF00',   // green
            '#00C000',   // dark green
            '#FFFF00',   // yellow
            '#FF8000',   // orange
            '#FF0000',   // red
            '#C00000',   // dark red
            '#FF00FF',   // magenta
            '#FFFFFF'    // white
        ];
        colors.forEach(color => {
            const div = document.createElement('div');
            div.style.flex = '1';
            div.style.background = color;
            legendScale.appendChild(div);
        });

        // Reflectivity color mapping (dBZ to RGBA)
        function getReflectivityColor(dbz) {
            if (dbz < 5) return [0, 0, 0, 0];           // transparent
            if (dbz < 10) return [158, 245, 255, 180];  // light blue
            if (dbz < 20) return [0, 0, 255, 180];      // blue
            if (dbz < 30) return [0, 255, 0, 180];      // green
            if (dbz < 40) return [0, 192, 0, 200];      // dark green
            if (dbz < 50) return [255, 255, 0, 200];    // yellow
            if (dbz < 60) return [255, 128, 0, 220];    // orange
            if (dbz < 70) return [255, 0, 0, 220];      // red
            if (dbz < 75) return [192, 0, 0, 240];      // dark red
            return [255, 0, 255, 255];                   // magenta
        }

        // Initialize NEXRAD layer
        function initNEXRAD() {
            const nexradUrl = 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png';

            nexradOverlay = L.tileLayer(nexradUrl, {
                opacity: 0.5,
                attribution: 'Iowa Environmental Mesonet - NEXRAD',
                maxZoom: 10,
                tileSize: 256
            });

            if (nexradVisible) {
                nexradOverlay.addTo(map);
            }

            document.getElementById('nexrad-status').textContent = 'Active';
        }

        // Fetch and render HRRR Alaska GRIB2 data
        async function fetchHRRRData() {
            const statusEl = document.getElementById('status');
            const hrrrStatusEl = document.getElementById('hrrr-status');
            const refreshBtn = document.getElementById('refresh');

            try {
                statusEl.textContent = 'Fetching HRRR Alaska GRIB2...';
                hrrrStatusEl.textContent = 'Loading...';
                refreshBtn.disabled = true;

                // Get current UTC time and find latest HRRR run
                const now = new Date();
                const hours = now.getUTCHours();
                const year = now.getUTCFullYear();
                const month = String(now.getUTCMonth() + 1).padStart(2, '0');
                const day = String(now.getUTCDate()).padStart(2, '0');

                // HRRR runs hourly but has a 1-2 hour delay
                const runHour = String(Math.max(0, hours - 2)).padStart(2, '0');
                const runDate = `${year}${month}${day}`;

                // HRRR Alaska GRIB2 URL from NOMADS
                // Format: hrrr.t{HH}z.wrfsubhf00.grib2
                // Using CORS proxy for NOMADS access
                const gribUrl = `https://nomads.ncep.noaa.gov/pub/data/nccf/com/hrrr/prod/hrrr.${runDate}/alaska/hrrr.t${runHour}z.wrfsubhak00.grib2`;
                const corsProxy = 'https://corsproxy.io/?';
                const fullUrl = corsProxy + encodeURIComponent(gribUrl);

                statusEl.textContent = 'Downloading GRIB2 data...';

                // Fetch GRIB2 file
                const response = await fetch(fullUrl);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const arrayBuffer = await response.arrayBuffer();
                statusEl.textContent = 'Parsing GRIB2 data...';

                // Parse GRIB2 and extract composite reflectivity
                // GRIB2 parameter for REFC (Composite Reflectivity)
                const gribData = await parseGRIB2(arrayBuffer);

                if (gribData) {
                    statusEl.textContent = 'Rendering HRRR overlay...';
                    renderHRRROverlay(gribData, runDate, runHour);

                    hrrrStatusEl.innerHTML = `${runDate} ${runHour}:00Z`;
                    statusEl.innerHTML = `<span style="color: green;">HRRR data loaded successfully</span>`;
                } else {
                    throw new Error('No REFC data found in GRIB2 file');
                }

            } catch (error) {
                console.error('Error fetching HRRR data:', error);
                hrrrStatusEl.innerHTML = `<span style="color: orange;">Not available</span>`;
                statusEl.innerHTML = `<span style="color: orange;">HRRR unavailable - using NEXRAD only</span><br><small>${error.message}</small>`;
            } finally {
                refreshBtn.disabled = false;
            }
        }

        // Parse GRIB2 and extract composite reflectivity
        async function parseGRIB2(arrayBuffer) {
            try {
                console.log('GRIB2 file size:', arrayBuffer.byteLength, 'bytes');

                const parser = new GRIB2Parser(arrayBuffer);
                const messages = parser.parse();

                console.log('Found', messages.length, 'GRIB2 messages');

                // Extract REFC data
                const refcData = parser.extractREFC();

                if (refcData) {
                    console.log('Found REFC data:', refcData.dataPoints, 'points');
                    return refcData;
                }

                return null;
            } catch (error) {
                console.error('Error parsing GRIB2:', error);
                throw error;
            }
        }

        // Render HRRR data as overlay
        function renderHRRROverlay(gribData, runDate, runHour) {
            if (hrrrOverlay) {
                map.removeLayer(hrrrOverlay);
            }

            // HRRR Alaska grid specifications (approximate)
            // Lambert conformal projection, centered on Alaska
            const gridWidth = 1299;   // HRRR Alaska grid dimensions
            const gridHeight = 919;

            // Alaska bounds for the HRRR grid
            const bounds = [[51.0, -179.0], [71.5, -130.0]];

            // Create canvas
            const canvas = document.createElement('canvas');
            canvas.width = gridWidth;
            canvas.height = gridHeight;
            const ctx = canvas.getContext('2d');

            // Draw reflectivity data
            const imageData = ctx.createImageData(gridWidth, gridHeight);

            // Parse and render the GRIB data
            // Note: This is a simplified rendering - actual HRRR data needs proper decoding
            if (gribData.rawData) {
                // Simple visualization: create a gradient for demo
                for (let y = 0; y < gridHeight; y++) {
                    for (let x = 0; x < gridWidth; x++) {
                        const idx = (y * gridWidth + x) * 4;

                        // This is placeholder - real implementation would decode GRIB2 data values
                        const value = 0; // Would come from decoded GRIB data

                        if (value > 0) {
                            const color = getReflectivityColor(value);
                            imageData.data[idx] = color[0];     // R
                            imageData.data[idx + 1] = color[1]; // G
                            imageData.data[idx + 2] = color[2]; // B
                            imageData.data[idx + 3] = color[3]; // A
                        } else {
                            imageData.data[idx + 3] = 0; // Transparent
                        }
                    }
                }
            }

            ctx.putImageData(imageData, 0, 0);

            hrrrOverlay = L.imageOverlay(canvas.toDataURL(), bounds, {
                opacity: 0.7,
                attribution: 'NOAA HRRR Alaska'
            });

            if (hrrrVisible) {
                hrrrOverlay.addTo(map);
            }
        }

        function refreshData() {
            fetchHRRRData();
        }

        function toggleHRRR() {
            const toggleBtn = document.getElementById('toggle-hrrr');
            if (hrrrVisible && hrrrOverlay) {
                map.removeLayer(hrrrOverlay);
                hrrrVisible = false;
                toggleBtn.textContent = 'Show HRRR';
            } else if (hrrrOverlay) {
                hrrrOverlay.addTo(map);
                hrrrVisible = true;
                toggleBtn.textContent = 'Hide HRRR';
            }
        }

        function toggleNEXRAD() {
            const toggleBtn = document.getElementById('toggle-nexrad');
            if (nexradVisible && nexradOverlay) {
                map.removeLayer(nexradOverlay);
                nexradVisible = false;
                toggleBtn.textContent = 'Show NEXRAD';
            } else if (nexradOverlay) {
                nexradOverlay.addTo(map);
                nexradVisible = true;
                toggleBtn.textContent = 'Hide NEXRAD';
            }
        }

        // Initialize on page load
        initNEXRAD();
        fetchHRRRData();

        // Auto-refresh every 15 minutes
        setInterval(fetchHRRRData, 15 * 60 * 1000);
    </script>
</body>
</html>
